<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card split">
    <aside class="brand-panel">
      <div class="lock">🔒</div>
      <h2>Bem-vindo</h2>
      <p>Acesse o sistema para gerenciar clientes, produtos e notas.</p>
    </aside>

    <section class="card-body">
      <form action="#" method="post">
        <div class="grid">
          <div class="field">
            <label for="cnpj">CNPJ</label>
            <input type="text" name="cnpj" id="cnpj" placeholder="00.000.000/0000-00">
          </div>
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" name="email" id="email" placeholder="seu@email.com">
          </div>
          <div class="field">
            <label for="senha">Senha</label>
            <input type="password" name="senha" id="senha" placeholder="••••••••">
          </div>
          <div class="field">
            <label for="razao_social">Razão Social</label>
            <input type="text" name="razao_social" id="razao_social" placeholder="Nome da empresa">
          </div>
        </div>
        <a href="home.html" class="btn btn-primary" style="display:block;margin-top:24px;">Login</a>
      </form>
      <p class="helper">Não tem conta? <a class="link" href="cadastro-usuario.html">Crie aqui!</a></p>
    </section>
  </main>
</body>
</html>
